<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<title>Cronograma</title>
		<link rel="stylesheet" href="../css/style.css" />
		<link rel="stylesheet" href="../css/cronograma.css" />
		<link rel="stylesheet" href="../css/notificacoes.css" />
	</head>
	<body>
		<div class="topbar">
			<img src="../images/logo.png" class="logo-img" alt="Logo ELLP" />
			<div class="user">Coordenador</div>
		</div>

		<div class="container">
			<h2 class="titulo">Cronograma</h2>

			<div class="card">
				<div class="campo">
					<label for="nome">Nome do Cronograma</label>
					<input
						type="text"
						id="nome"
						placeholder="Ex: Projeto Social 2026"
						required />
				</div>

				<div class="campo">
					<label for="descricao">Sintese das atividades</label>
					<textarea
						id="descricao"
						placeholder="Descreva as atividades"
						required></textarea>
				</div>

				<div class="form-grid">
					<div class="campo">
						<label for="data_inicio">Data de Inicio</label>
						<input type="date" id="data_inicio" required />
						<small class="ajuda-campo" id="ajuda_data_inicio"></small>
					</div>

					<div class="campo">
						<label for="data_fim">Data de Fim</label>
						<input type="date" id="data_fim" required />
						<small class="ajuda-campo" id="ajuda_data_fim"></small>
					</div>
				</div>

				<div class="form-buttons">
					<button class="btn-cancelar" onclick="voltar()">Cancelar</button>
					<button onclick="salvar()">Salvar</button>
				</div>
			</div>

			<h3 class="subtitulo-lista">Cronogramas Criados</h3>
			<div id="lista-cronogramas"></div>
		</div>

		<script src="../js/config.js"></script>
		<script src="../js/notificacoes.js"></script>
		<script src="../js/cronograma.js"></script>
	</body>
</html>
